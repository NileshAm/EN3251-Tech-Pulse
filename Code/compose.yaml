services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/acl:/mosquitto/config/acl:ro
      - ./deploy/passwords:/mosquitto/config/passwords:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped
volumes:
  mqtt-data:
